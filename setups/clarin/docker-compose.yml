services:

  # The "backend" and "frontend" containers are the actual Korp backend + frontend Clarin setup.
  backend:
    build: ../../backend
    # fixes race condition https://vsupalov.com/simple-fix-db-not-ready/
    restart: on-failure
    volumes:
      # CORPORA_DIR defaults to the production path; override it in a local
      # .env file (git-ignored), e.g. CORPORA_DIR=/Users/me/Code/corpora.
      # The container path stays /opt/corpora because the CWB registry files
      # contain absolute HOME paths under /opt/corpora/data.
      - ${CORPORA_DIR:-/opt/corpora}:/opt/corpora
      # Corpus/mode configuration served to the frontend by /corpus_config
      # (korp-backend >= 8.1). Generated from the old JS mode files by
      # scripts/modejs2yaml.js; now the source of truth.
      - ./corpus_config:/opt/corpus_config:ro
    ports:
      # Korp backend server
      - "1234:1234"
  frontend:
    build:
      context: frontend/
      args:
        # Where the browser reaches the backend. Production default; set
        # KORP_BACKEND_URL=http://localhost:1234 in the local .env file.
        KORP_BACKEND_URL: ${KORP_BACKEND_URL:-https://alf.hum.ku.dk/korp/backend}
        # Exporter (download all KWIC rows); relative to the page URL in production.
        KORP_EXPORTER_URL: ${KORP_EXPORTER_URL:-download/csv}
      additional_contexts:
        # The mkdocs user guide sources, shared by all setups.
        userguides: ../../doc/userguides
    restart: on-failure
    depends_on:
      - backend
    ports:
      # Korp frontend server
      - "9111:9111"

  # The bottom three containers all relate entirely to korp-fcs-endpoint.
  # Note that the fcs-prep container only runs until `mvn test` completes.
  backend-v6:
    build: docker/backend-v6/
    restart: on-failure
    volumes:
      - ${CORPORA_DIR:-/opt/corpora}:/opt/corpora
  fcs-prep:
    build: docker/fcs/prep/
    image: fcs-prep-build
    depends_on:
      - backend-v6
  fcs:
    build: docker/fcs/
    depends_on:
      - fcs-prep
    restart: on-failure
    ports:
      - "8088:8080"
  exporter:
    build: ../../exporter/
    ports:
      # Exporter (download all KWIC rows), see exporter/README.md
      - "14000:4000"
    volumes:
      - ./../../exporter/hostvar/tmp/data:/var/tmp/data
      - ./../../exporter/hostvar/tmp/output:/var/tmp/output
