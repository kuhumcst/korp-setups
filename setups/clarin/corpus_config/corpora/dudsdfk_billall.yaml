# Generated by scripts/modejs2yaml.js from the pre-2026 JavaScript mode files. Edit freely; the JS files are the past.
id: "dudsdfk_billall"
title: "Jens Billes haandskrift (1557-1559)"
description: "Her svarer en sætning til en linje (vers) i en vise, og et afsnit i teksten svarer til en strofe. Ved uklar datering bruges en fiktiv startdato."
mode:
  - name: "medieval_ballads"
    folder: "duds.dfk"
within:
  - label:
      dan: "sætning"
      eng: "sentence"
    value: "sentence"
  - label:
      dan: "op til paragraf"
      eng: "paragraph"
    value: "p"
context:
  - label: "1 sentence"
    value: "1 sentence"
  - label: "1 p"
    value: "1 paragraph"
pos_attributes:
  - neutral:
      label:
        dan: "Neutral form"
        eng: "Neutral form"
      type: "set"
      opts:
        is: "="
        is_not: "!="
        starts_with: "^="
        contains: "_="
        ends_with: "&="
        matches: "*="
        matches_not: "!*="
      extended_template: "<input ng-model='model' >"
      order: 1
      hide_sidebar: true
  - lemma:
      label:
        dan: "Lemma"
        eng: "Lemma"
      type: "set"
      opts:
        is: "="
        is_not: "!="
        starts_with: "^="
        contains: "_="
        ends_with: "&="
        matches: "*="
        matches_not: "!*="
      extended_template: "<input ng-model='model' >"
      order: 2
      hide_sidebar: true
  - pos:
      label:
        dan: "Ordklasse"
        eng: "Part of speech"
      dataset:
        adj: "ADJ"
        adv: "AB"
        art: "UNIK"
        sb: "NN"
        konj: "konj"
        intj: "intj"
        num: "num"
        tgn: "OTHER"
        "præp": "PREP"
        pron: "PRON"
        "stn|pers|bn": "PROPN"
        uvis: "uvis"
        vb: "vb"
        ukl: "ukl"
      opts:
        is: "="
        is_not: "!="
      extended_component: "datasetSelect"
      escape: false
      order: 3
  - glosse:
      label:
        dan: "Glosse"
        eng: "Gloss"
      opts:
        is: "="
        is_not: "!="
        starts_with: "^="
        contains: "_="
        ends_with: "&="
        matches: "*="
        matches_not: "!*="
      order: 4
struct_attributes:
  - text_title:
      label: "title"
      order: 1
  - text_date:
      label: "date"
      order: 2
  - p_id:
      label: "strofeid"
      order: 3
  - sentence_type:
      label: "stype"
      order: 4
  - text_url:
      label: "view_ballad"
      pattern: "<a href=\"https://cst.dk/dighumlab/duds/DFK/Dorthe/html/<%=val%>\" target=\"_blank\"><%=val%></a>"
      order: 5
custom_attributes:
  - source_neutral_lemma_forms:
      label:
        dan: "Ordform, neutral form, lemma"
        eng: "Token, neutral form, lemma"
      order: 0
      custom_type: "pos"
      pattern: "<p style=\"margin-left: 15px;\"><%=pos_attrs.word%></p><p style=\"margin-left: 15px;\"><%=pos_attrs.neutral%></p><p style=\"margin-left: 15px;margin-bottom: 10px;\"><%=pos_attrs.lemma%></p>"
