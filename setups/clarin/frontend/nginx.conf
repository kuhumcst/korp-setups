# nginx for the CLARIN Korp frontend: static dist/ plus the mkdocs user guide.
# Port 9111 keeps the compose port mapping and the reverse-proxy rules on the
# production gateway unchanged from the old `yarn start:dist` server.
server {
    listen 9111;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed bundles and translations can be cached for a long time; the
    # hash changes on every release.
    location ~* "\.[0-9a-f]{20}\.(js|json)$" {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must always be revalidated so a release is picked up.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
